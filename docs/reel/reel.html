<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Skillify reel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
<style>
html, body { margin: 0; background: #0a0d14; }
canvas { display: block; width: 100vw; height: auto; max-width: 1920px; margin: 0 auto; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const W = 1920, H = 1080, FPS = 60, BAR = 10 / 3, DUR = 47 * BAR;
const N = 9000;
const SERIF = "'Instrument Serif', Georgia, serif", MONO = "'IBM Plex Mono', ui-monospace, monospace";
const BG = [10, 13, 20], WHITE = [214, 221, 233], GOLD = [233, 181, 94];

const cv = document.getElementById("c");
const ctx = cv.getContext("2d");

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const P = (t, a, b) => clamp((t - a) / (b - a));
const smooth = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const outC = (t) => 1 - Math.pow(1 - t, 3);
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let x = Math.imul(seed ^ (seed >>> 15), 1 | seed); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; }

/* particles */
const r0 = rng(7);
const RA = new Float32Array(N), RB = new Float32Array(N), RC = new Float32Array(N), RD = new Float32Array(N), Z = new Float32Array(N), HX = new Float32Array(N), HY = new Float32Array(N), GX = new Float32Array(N), GY = new Float32Array(N);
const GOLDP = new Uint8Array(N);
for (let i = 0; i < N; i++) {
	RA[i] = r0(); RB[i] = r0(); RC[i] = r0(); RD[i] = r0();
	Z[i] = 0.55 + r0() * 0.9;
	HX[i] = r0() * W; HY[i] = r0() * H;
	const u1 = Math.max(1e-6, r0()), u2 = r0(), m = Math.sqrt(-2 * Math.log(u1));
	GX[i] = m * Math.cos(6.2832 * u2); GY[i] = m * Math.sin(6.2832 * u2);
	GOLDP[i] = i % 13 === 0 ? 1 : 0;
}
let fx = 0, fy = 0, fb = 1, fc = 0, fj = 1;
const set = (x, y, b = 0.85, c = 0, j = 1) => { fx = x; fy = y; fb = b; fc = c; fj = j; };

/* shape helpers */
function noiseAt(i, t, b = 0.5) {
	const a = RA[i] * 6.2832, bb = RB[i] * 6.2832, z = Z[i];
	set(HX[i] + (110 * Math.sin(0.07 * t + a) + 46 * Math.sin(0.19 * t + bb * 1.3)) * z, HY[i] + (80 * Math.cos(0.06 * t + bb) + 40 * Math.sin(0.15 * t + a * 1.7)) * z, b * (0.55 + 0.45 * RC[i]), 0, 0);
}
function cluster(i, cx, cy, r, b = 0.9, c = 0) { set(cx + GX[i] * r, cy + GY[i] * r, b, c, 0.6); }
function disc(i, cx, cy, r, b = 0.9, c = 0) { const a = RA[i] * 6.2832, rr = Math.sqrt(RB[i]) * r; set(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr, b, c, 0.6); }
function seg(i, x0, y0, x1, y1, s, th = 3, b = 0.9, c = 0) { const dx = x1 - x0, dy = y1 - y0, l = Math.hypot(dx, dy) || 1; set(x0 + dx * s - (dy / l) * GX[i] * th, y0 + dy * s + (dx / l) * GX[i] * th, b, c, 0.4); }
function ellipse(i, cx, cy, rx, ry, s, th = 2, b = 1, c = 1) { const a = s * 6.2832; set(cx + Math.cos(a) * (rx + GX[i] * th), cy + Math.sin(a) * (ry + GY[i] * th), b, c, 0.4); }
function poly(pts) {
	const L = [0];
	for (let k = 1; k < pts.length; k++) L.push(L[k - 1] + Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1]));
	const total = L[L.length - 1];
	return (s) => {
		const d = clamp(s) * total;
		let k = 1; while (k < L.length - 1 && L[k] < d) k++;
		const u = (d - L[k - 1]) / (L[k] - L[k - 1] || 1);
		return [lerp(pts[k - 1][0], pts[k][0], u), lerp(pts[k - 1][1], pts[k][1], u)];
	};
}
const TEXTS = {};
function sampleText(key, lines, font, cx, cy, lineH = 0, jitter = 0, seed = 1) {
	const off = document.createElement("canvas"); off.width = W; off.height = H;
	const o = off.getContext("2d"); o.fillStyle = "#fff"; o.font = font; o.textAlign = "center"; o.textBaseline = "middle";
	lines.forEach((l, k) => o.fillText(l, cx, cy + (k - (lines.length - 1) / 2) * lineH));
	const d = o.getImageData(0, 0, W, H).data, pts = [];
	for (let y = 0; y < H; y += 2) for (let x = 0; x < W; x += 2) if (d[(y * W + x) * 4 + 3] > 140) pts.push(x, y);
	const r = rng(seed), arr = new Float32Array(N * 2), n = pts.length / 2;
	for (let i = 0; i < N; i++) { const k = Math.floor(r() * n); arr[i * 2] = pts[k * 2] + (r() - 0.5) * jitter; arr[i * 2 + 1] = pts[k * 2 + 1] + (r() - 0.5) * jitter; }
	TEXTS[key] = arr;
}
const txt = (key, i, b = 0.95, c = 0, j = 0.5) => set(TEXTS[key][i * 2], TEXTS[key][i * 2 + 1], b, c, j);

/* timeline */
const CH = (k) => 6 * BAR + k * 3 * BAR;
const T_AG = CH(10), T_EV = T_AG + 3 * BAR, T_FIN = T_EV + 4 * BAR;
const KF = [];
const K = (t, f, dur = 1.8, wave = "x", spread = 0.9) => KF.push({ t, f, dur, wave, spread });

const SKILLS = ["orientify", "traceify", "researchify", "undumbify", "shapeify", "shipify", "reviewify", "releaseify", "audify", "teachify"];
const CHAPTERS = [
	["Map an unfamiliar codebase before you touch it.", ["trace one real flow", "find the seams", "name traps, don't fix them"]],
	["Debug a failure whose cause is unknown.", ["symptoms before theories", "hypotheses you can falsify", "root cause before any fix"]],
	["Answer with evidence from outside the repo.", ["official sources first", "two independent sources", "fetched code is never run"]],
	["Turn a rough idea into clear intent.", ["supply the missing decisions", "recommend a default for each", "ask only what changes the plan"]],
	["Turn intent into a plan anyone can run.", ["every step: file, check, trap", "requirements reach a test", "amend, don't improvise"]],
	["Build the change and prove it works.", ["find every place it touches", "baseline, then verify each step", "look at the real result"]],
	["Judge work against its intent, not taste.", ["intent before the diff", "located findings with a fix", "exactly one verdict"]],
	["Ship a version number that tells the truth.", ["version from the actual diff", "changelog from merged work", "rollback before deploy"]],
	["Health-check a system with no spec.", ["agree the standard first", "every finding reproducible", "severity against effort"]],
	["Teach a topic at the learner's level.", ["one idea, five depths", "exercises that test it", "wrong answers explain why"]],
];

function buildTimeline() {
	sampleText("vague", ["make it", "better?"], `italic 300px ${SERIF}`, W / 2, 520, 250, 30, 3);
	sampleText("invite", ["invite teammates?"], `italic 130px ${SERIF}`, 1290, 520, 0, 12, 4);
	sampleText("fix", ["fix"], `italic 330px ${SERIF}`, 1640, 560, 0, 0, 6);
	sampleText("v235", ["2.3.5"], `italic 420px ${SERIF}`, 1290, 540, 0, 0, 8);
	sampleText("v300", ["3.0.0"], `italic 420px ${SERIF}`, 1290, 540, 0, 0, 9);
	sampleText("word", ["Skillify"], `italic 400px ${SERIF}`, W / 2, 500, 0, 0, 10);

	K(0, (i, t) => { noiseAt(i, t, 0.7); fb *= clamp((t - RA[i] * 2.6) / 1.4); });
	K(BAR, (i, t) => { noiseAt(i, t, 0.7); if (GOLDP[i]) fc = 0.9; });
	K(2 * BAR, (i, t) => txt("vague", i, 0.9, GOLDP[i] ? 0.9 : 0, 3), 2.8, "r", 1.4);
	K(4 * BAR, (i, t) => {
		const c = i % 10, h = 150 + ((c * 37) % 5) * 55;
		set(330 + c * 140 + GX[i] * 12, 700 - RB[i] * h - (GOLDP[i] ? 0 : 0), 0.9, GOLDP[i] ? 1 : 0, 0.5);
	}, 2.4, "x", 1.2);

	// 1 orientify
	{
		const T = CH(0);
		const nodes = [[90, 80], [300, 60], [520, 110], [760, 70], [170, 280], [420, 260], [640, 300], [860, 260], [120, 480], [360, 500], [600, 480], [840, 450], [200, 660], [470, 690], [720, 660]].map(([x, y]) => [860 + x, 170 + y]);
		const edges = [[0, 1], [1, 2], [1, 4], [1, 5], [2, 3], [4, 6], [5, 6], [6, 7], [4, 8], [8, 9], [6, 10], [10, 7], [9, 11], [8, 12], [12, 13], [13, 14], [10, 14], [3, 7]];
		const flow = poly([0, 1, 4, 6, 10, 7].map((k) => nodes[k]));
		const base = (i, t) => {
			if (GOLDP[i]) return cluster(i, ...nodes[0], 5, 1.3, 1);
			if (i % 10 < 6) { const n = i % 15, trap = (n === 12 || n === 10) && t > T + 6.4; return cluster(i, ...nodes[n], trap ? lerp(8, 24, P(t, T + 6.4, T + 7.4)) : 8, trap ? 0.7 : 1.0); }
			const e = edges[i % edges.length]; seg(i, ...nodes[e[0]], ...nodes[e[1]], RA[i], 1.2, 0.42);
		};
		K(T, base, 2.2, "x", 1.0);
		K(T + 3.0, (i, t) => { if (!GOLDP[i]) return base(i, t); const prog = P(t, T + 3.0, T + 6.0); const p = flow(Math.min(RA[i], prog)); set(p[0] + GX[i] * 1.5, p[1] + GY[i] * 1.5, RA[i] > prog - 0.02 ? 1.5 : 1.1, 1, 0.3); }, 0.4);
		OVER.push((t) => nodes.forEach(([x, y], k) => label(["main.ts", "router.ts", "auth.ts", "config.ts", "orders.ts", "cart.ts", "totals.ts", "db.ts", "invoice.ts", "email.ts", "cache.ts", "queue.ts", "legacy/pay.ts", "report.ts", "utils.ts"][k], x + 16, y - 14, P(t, T + 1.6 + k * 0.04, T + 2.4 + k * 0.04) * fadeOut(t, T), 14, [0, 10, 12].includes(k) ? "gold" : "dim")));
		OVER.push((t) => { const a = P(t, T + 6.6, T + 7.4) * fadeOut(t, T); label("half-migrated", nodes[12][0] + 16, nodes[12][1] + 34, a, 14, "gold"); label("untested", nodes[10][0] + 16, nodes[10][1] + 34, a, 14, "gold"); });
	}
	// 2 traceify
	{
		const T = CH(1), C = [[1000, 440], [1320, 440], [1640, 440]];
		const path = poly([[1760, 170], [1560, 300], [1320, 440], [1160, 620], [1020, 800]]);
		const hyp = (i, t, drop0, drop2) => {
			if (GOLDP[i]) return disc(i, ...C[1], 60, 1.2, 1);
			const k = i % 3;
			if ((k === 0 && drop0) || (k === 2 && drop2)) { noiseAt(i, t, 0.16); return; }
			disc(i, ...C[k], 92, 0.85);
		};
		K(T, (i, t) => hyp(i, t, false, false), 2.2, "x");
		K(T + 3.6, (i, t) => hyp(i, t, true, false), 2.0, "rand", 0.8);
		K(T + 4.8, (i, t) => hyp(i, t, true, true), 2.0, "rand", 0.8);
		K(T + 6.2, (i, t) => {
			const k = i % 3;
			if (!GOLDP[i] && k !== 1) { noiseAt(i, t, 0.16); return; }
			const s = (RA[i] + (t - T) * 0.09) % 1, p = path(s);
			const root = s > 0.92;
			set(p[0] + GX[i] * (1 - s) * 18, p[1] + GY[i] * (1 - s) * 18, root ? 1.4 : 0.9, GOLDP[i] || root ? 1 : 0.35, 0.3);
		}, 1.6, "rand", 0.7);
		OVER.push((t) => {
			const f = fadeOut(t, T);
			[["H1", "env var drift"], ["H2", "pool exhausted after ORM bump"], ["H3", "race in session refresh"]].forEach(([a, b], k) => {
				const gone = (k === 0 && t > T + 3.6) || (k === 2 && t > T + 4.8);
				const al = P(t, T + 1.8 + k * 0.12, T + 2.5 + k * 0.12) * (gone ? 1 - P(t, T + 3.6 + (k ? 1.2 : 0), T + 4.2 + (k ? 1.2 : 0)) : 1) * (t > T + 6.2 && k === 1 ? 1 - P(t, T + 6.2, T + 6.8) : 1) * f;
				label(a, C[k][0], C[k][1] + 150, al, 16, k === 1 ? "gold" : "dim", "center");
				label(b, C[k][0], C[k][1] + 174, al, 14, "dim", "center");
			});
			label("root cause", 1040, 850, P(t, T + 7.0, T + 7.8) * f, 30, "goldSerif", "left");
			label("ORM 5.0 halved the pool; checkout runs out under load", 1040, 884, P(t, T + 7.4, T + 8.2) * f, 14, "dim", "left");
		});
	}
	// 3 researchify
	{
		const T = CH(2), ty = [300, 440, 580, 720];
		const tierOf = (i) => (i % 10 < 4 ? 0 : i % 10 < 7 ? 1 : i % 10 < 9 ? 2 : 3);
		const strata = (i, t, fall, find) => {
			const k = tierOf(i);
			if (find && GOLDP[i] && k < 2) return cluster(i, 1690, 200, 11, 1.4, 1);
			if (k === 3 && fall) { set(900 + RA[i] * 880, lerp(ty[3], 1000, P(t, T + 4.2, T + 6)) + GY[i] * 30, 0.12, 0, 1); return; }
			set(900 + RA[i] * 880, ty[k] + GY[i] * 5, k === 3 ? 0.45 : 0.9 - k * 0.12, GOLDP[i] ? 0.6 : 0, 0.5);
		};
		K(T, (i, t) => strata(i, t, false, false), 2.4, "y", 1.2);
		K(T + 4.2, (i, t) => strata(i, t, true, false), 0.3);
		K(T + 5.6, (i, t) => strata(i, t, true, true), 1.8, "rand", 0.6);
		OVER.push((t) => {
			const f = fadeOut(t, T);
			["official", "maintainers", "maintained", "popular, stale"].forEach((n, k) => label(n, 880, ty[k] + 5, P(t, T + 1.8 + k * 0.1, T + 2.5 + k * 0.1) * f * (k === 3 ? 1 - 0.6 * P(t, T + 4.2, T + 5) : 1), 14, k === 3 ? "dim" : "mid", "right"));
			label("finding · high · two independent sources", 1660, 250, P(t, T + 6.6, T + 7.4) * f, 14, "gold", "right");
			label("fetched code is read, never run", 900, 880, P(t, T + 7.0, T + 7.8) * f, 14, "dim");
		});
	}
	// 4 undumbify
	{
		const T = CH(3), cx = 1290, cy = 520;
		const hex = [...Array(6)].map((_, k) => [cx + Math.cos(k / 6 * 6.2832 - 1.57) * 330, cy + Math.sin(k / 6 * 6.2832 - 1.57) * 250]);
		const names = ["expires in 7 days", "owner invites · member role", "seat billed on accept", "revoke anytime", "max 10 pending", "email must match"];
		K(T, (i, t) => txt("invite", i, 0.8, 0, 2), 1.9, "r", 0.7);
		K(T + 2.8, (i, t) => (GOLDP[i] ? cluster(i, cx, cy, 10, 1.4, 1) : cluster(i, ...hex[i % 6], 20, 0.95)), 2.2, "r", 1.0);
		K(T + 6.0, (i, t) => (GOLDP[i] ? seg(i, 960, 300, 960, 760, RA[i], 1.5, 1.2, 1) : seg(i, 1000, 300 + (i % 6) * 92, 1000 + 260 + ((i % 6) * 53) % 240, 300 + (i % 6) * 92, RA[i], 2.5, 0.9)), 2.0, "y", 1.0);
		OVER.push((t) => {
			const f = fadeOut(t, T), a = P(t, T + 4.0, T + 4.8) * (1 - P(t, T + 5.8, T + 6.3));
			hex.forEach(([x, y], k) => label(names[k], x, y + 46, a * f, 14, "mid", "center"));
			label("? should private workspaces be invite-only", cx, cy + 40, a * f, 14, "gold", "center");
			names.forEach((n, k) => label(n, 1000, 300 + k * 92 - 16, P(t, T + 7.0 + k * 0.08, T + 7.6 + k * 0.08) * f, 14, "mid"));
			label("intent brief", 960, 270, P(t, T + 7.0, T + 7.6) * f, 26, "goldSerif");
		});
	}
	// 5 shapeify
	{
		const T = CH(4), rows = [300, 430, 560, 690], cols = [[900, 1200], [1240, 1470], [1510, 1740]];
		const tri = poly([[1625, 545], [1648, 585], [1602, 585], [1625, 545]]);
		const form = (i, t, acc) => {
			if (GOLDP[i]) { const p = tri(RA[i]); return set(p[0], p[1], 1.4, 1, 0.3); }
			if (acc && i % 7 === 0) return seg(i, 900, 820, 1740, 820, RA[i], 2, 0.9, 0.55);
			if (i % 23 === 0) { const r = i % 3; return seg(i, 870, rows[r] + 6, 870, rows[r + 1] - 6, RA[i], 1, 0.5); }
			const r = i % 4, c = Math.floor(i / 4) % 3;
			if (r === 2 && c === 2) return seg(i, cols[2][0], rows[r], cols[2][0] + 60, rows[r], RA[i], 2, 0.3);
			seg(i, cols[c][0], rows[r], cols[c][1], rows[r], RA[i], 4, c ? 0.62 : 0.95);
		};
		K(T, (i, t) => form(i, t, false), 2.2, "y");
		K(T + 4.6, (i, t) => form(i, t, true), 1.6, "x", 0.6);
		OVER.push((t) => {
			const f = fadeOut(t, T);
			["where", "verify", "trap"].forEach((h, k) => label(h, cols[k][0], 250, P(t, T + 1.8, T + 2.4) * f, 13, "dim"));
			["P1  db/schema.ts", "P2  api/share.ts", "P3  routes/s/[token]", "P4  jobs/expire.ts"].forEach((n, k) => label(n, cols[0][0], rows[k] - 16, P(t, T + 2.0 + k * 0.1, T + 2.7 + k * 0.1) * f, 14, "mid"));
			label("private songs leak via queue API", 1740, 612, P(t, T + 3.0, T + 3.8) * f, 13, "gold", "right");
			label("A1  expired → 410 · revoked → 404", 900, 850, P(t, T + 5.4, T + 6.2) * f, 14, "mid");
		});
	}
	// 6 shipify
	{
		const T = CH(5), ys = [...Array(9)].map((_, k) => 250 + k * 64), lens = [300, 280, 360, 300, 330, 240, 280, 220, 250];
		const hits = [0, 1, 2, 3, 4];
		const check = (k) => poly([[1560, ys[k] - 2], [1578, ys[k] + 14], [1612, ys[k] - 20]]);
		const lines = (i, t, scan, checks) => {
			if (GOLDP[i]) {
				if (checks) { const k = i % 5, p = check(k)(RA[i]); return set(p[0], p[1], 1.4, 1, 0.3); }
				const y = scan ? lerp(220, 840, smooth(P(t, T + 2.2, T + 4.8))) : 220;
				return seg(i, 830, y, 1420, y, RA[i], 1, scan ? 1.2 : 0.5, 1);
			}
			const k = i % 9, hit = hits.includes(k) && scan && t > T + 2.2 + (ys[k] - 220) / 620 * 2.6;
			seg(i, 880, ys[k], 880 + lens[k], ys[k], RA[i], 2, hit ? 1.1 : 0.55, hit ? 0.85 : 0);
		};
		K(T, (i, t) => lines(i, t, false, false), 2.2, "y");
		K(T + 2.2, (i, t) => lines(i, t, true, false), 0.6);
		K(T + 5.2, (i, t) => lines(i, t, true, true), 1.8, "y", 0.6);
		OVER.push((t) => {
			const f = fadeOut(t, T);
			["orders.js", "totals.js", "invoice.js", "receipt.js", "revenue.js", "serialize.js", "refunds.js", "session.js", "dates.js"].forEach((n, k) => label(n, 870, ys[k] - 14, P(t, T + 1.8 + k * 0.05, T + 2.4 + k * 0.05) * f, 13, "dim", "right"));
			label("every place it touches: 5, not 1", 880, 870, P(t, T + 4.8, T + 5.6) * f, 14, "gold");
			label("verified, then looked at", 1640, 890, P(t, T + 6.6, T + 7.4) * f, 22, "goldSerif", "right");
		});
	}
	// 7 reviewify
	{
		const T = CH(6), ys = [...Array(9)].map((_, k) => 240 + k * 64), ind = [0, 1, 1, 2, 2, 2, 3, 2, 1], lens = [420, 260, 330, 230, 340, 360, 380, 40, 200];
		const flagged = [3, 5, 6], hitT = [T + 2.8, T + 3.5, T + 4.2];
		const code = (i, t, verdict) => {
			if (GOLDP[i]) {
				if (verdict) return txt("fix", i, 1.2, 1, 0.4);
				const r = i % 3, k = flagged[r];
				if (t < hitT[r]) return set(840, ys[k], 0, 1, 0);
				const x0 = 880 + ind[k] * 36, cx = x0 + lens[k] / 2;
				return ellipse(i, cx, ys[k], lens[k] / 2 + 40, 26, RA[i], 1.5, 1.2, 1);
			}
			const k = i % 9, x0 = 880 + ind[k] * 36, on = flagged.includes(k) && t > hitT[flagged.indexOf(k)];
			seg(i, x0, ys[k], x0 + lens[k], ys[k], RA[i], 2, on ? 1.0 : 0.6, on ? 0.7 : 0);
		};
		K(T, (i, t) => code(i, t, false), 2.2, "y");
		K(T + 2.8, (i, t) => code(i, t, false), 0.8, "rand", 0.3);
		K(T + 5.4, (i, t) => code(i, t, true), 1.5, "rand", 0.4);
		OVER.push((t) => {
			const f = fadeOut(t, T);

/* renderer */
const acc = new Float32Array(W * H * 3);
const img = ctx.createImageData(W, H);
const vig = new Float32Array(W * H);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const dx = (x - W / 2) / (W * 0.62), dy = (y - H / 2) / (H * 0.62); vig[y * W + x] = 1 - 0.28 * Math.min(1, dx * dx + dy * dy); }
const grain = new Float32Array(512 * 512); { const r = rng(99); for (let i = 0; i < grain.length; i++) grain[i] = (r() - 0.5) * 5; }

function frameKey(t) { let k = 0; while (k < KF.length - 1 && t >= KF[k + 1].t) k++; return k; }
function splat(x, y, r, g, b) {
	const x0 = Math.floor(x), y0 = Math.floor(y);
	if (x0 < 0 || y0 < 0 || x0 >= W - 1 || y0 >= H - 1) return;
	const fx1 = x - x0, fy1 = y - y0;
	const w00 = (1 - fx1) * (1 - fy1), w10 = fx1 * (1 - fy1), w01 = (1 - fx1) * fy1, w11 = fx1 * fy1;
	let p = (y0 * W + x0) * 3;
	acc[p] += r * w00; acc[p + 1] += g * w00; acc[p + 2] += b * w00;
	acc[p + 3] += r * w10; acc[p + 4] += g * w10; acc[p + 5] += b * w10;
	p += W * 3;
	acc[p] += r * w01; acc[p + 1] += g * w01; acc[p + 2] += b * w01;
	acc[p + 3] += r * w11; acc[p + 4] += g * w11; acc[p + 5] += b * w11;
}
function particlesAt(t, weight, camS, camX, camY) {
	const k = frameKey(t), cur = KF[k], prev = KF[Math.max(0, k - 1)];
	for (let i = 0; i < N; i++) {
		cur.f(i, t); const bx = fx, by = fy, bb = fb, bc = fc, bj = fj;
		let x = bx, y = by, b = bb, c = bc, j = bj;
		if (k > 0) {
			let d;
			if (cur.wave === "x") d = bx / W; else if (cur.wave === "y") d = by / H; else if (cur.wave === "r") d = Math.hypot(bx - W / 2, by - H / 2) / 1100; else d = RD[i];
			const e = smooth(clamp((t - cur.t - (d * cur.spread + RC[i] * 0.35)) / cur.dur));
			if (e < 1) {
				prev.f(i, t);
				x = lerp(fx, bx, e); y = lerp(fy, by, e); b = lerp(fb, bb, e); c = lerp(fc, bc, e); j = lerp(fj, bj, e);
				const mid = Math.sin(e * Math.PI) * Math.min(1, Math.hypot(bx - fx, by - fy) / 220);
				x += mid * GX[i] * 40 * Z[i]; y += mid * GY[i] * 40 * Z[i];
			}
		}
		const z = Z[i];
		x += j * 2.2 * Math.sin(t * 0.9 + RA[i] * 40); y += j * 2.2 * Math.cos(t * 0.8 + RB[i] * 40);
		x = (x - W / 2) * camS * (1 + (z - 1) * 0.03) + W / 2 + camX * z; y = (y - H / 2) * camS * (1 + (z - 1) * 0.03) + H / 2 + camY * z;
		const lum = b * weight * (0.5 + 0.5 * z) * 1.9;
		if (lum <= 0.002) continue;
		const cr = lerp(WHITE[0], GOLD[0], c), cg = lerp(WHITE[1], GOLD[1], c), cb = lerp(WHITE[2], GOLD[2], c);
		splat(x, y, cr * lum, cg * lum, cb * lum);
		if (z > 1.25) { const s = lum * 0.22; splat(x + 1, y, cr * s, cg * s, cb * s); splat(x - 1, y, cr * s, cg * s, cb * s); splat(x, y + 1, cr * s, cg * s, cb * s); splat(x, y - 1, cr * s, cg * s, cb * s); }
	}
}
function render(t, samples = 4) {
	acc.fill(0);
	const shutter = 0.5 / FPS;
	const camS = 1 + 0.018 * Math.sin(t * 0.05), camX = 10 * Math.sin(t * 0.031), camY = 6 * Math.cos(t * 0.027);
	for (let s = 0; s < samples; s++) particlesAt(Math.max(0, t - shutter * s / Math.max(1, samples - 1)), 1 / samples, camS, camX, camY);
	const d = img.data, go = (Math.floor(t * FPS) * 7919) % (512 * 512);
	const fadeEnd = 1 - P(t, DUR - 1.4, DUR);
	for (let p = 0, q = 0, n = W * H; p < n; p++, q += 3) {
		const v = vig[p], g = grain[(p + go) % 262144];
		const r = acc[q], gg = acc[q + 1], b = acc[q + 2];
		d[p * 4] = (BG[0] * v + 255 * (1 - Math.exp(-r / 255 * 1.6)) + g) * fadeEnd;
		d[p * 4 + 1] = (BG[1] * v + 255 * (1 - Math.exp(-gg / 255 * 1.6)) + g) * fadeEnd;
		d[p * 4 + 2] = (BG[2] * v + 255 * (1 - Math.exp(-b / 255 * 1.6)) + g) * fadeEnd;
		d[p * 4 + 3] = 255;
	}
	ctx.putImageData(img, 0, 0);
	ctx.save(); ctx.globalAlpha = fadeEnd;
	introCaption(t); chapterCaption(t); OVER.forEach((f) => f(t)); sectionCaptions(t);
	ctx.restore();
}

window.render = render;
window.DURATION = DUR;
window.ready = Promise.all([document.fonts.load(`italic 100px ${SERIF}`), document.fonts.load(`400 14px ${MONO}`), document.fonts.load(`500 16px ${MONO}`)]).then(() => { buildTimeline(); });
if (!location.search.includes("record")) {
	window.ready.then(() => {
		const q = new URLSearchParams(location.search), from = Number(q.get("t") ?? 0);
		const start = performance.now();
		const loop = () => { render((from + (performance.now() - start) / 1000) % DUR, 1); requestAnimationFrame(loop); };
		loop();
	});
}
</script>
</body>
</html>
