<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Skillify reel</title>
<style>
html, body { margin: 0; background: #07080a; }
canvas { display: block; width: 100vw; height: auto; max-width: 1920px; margin: 0 auto; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const W = 1920, H = 1080, FPS = 60;
const C = { ink: "#07080a", bone: "#efeae0", dim: "#6b6f76", mid: "#9a9ea5", faint: "#24272c", card: "#0f1115", line: "#1a1d22", acc: "#f2a33a", ok: "#57d08a" };
const DISP = '"Inter Display", Inter, system-ui, sans-serif';
const MONO = '"JetBrainsMono NF", "JetBrains Mono", ui-monospace, monospace';

const cv = document.getElementById("c");
const out = cv.getContext("2d");
const buf = document.createElement("canvas");
buf.width = W; buf.height = H;
const g = buf.getContext("2d");

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const P = (t, a, b) => clamp((t - a) / (b - a));
const E = {
	outExpo: (t) => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t)),
	inExpo: (t) => (t <= 0 ? 0 : Math.pow(2, 10 * t - 10)),
	inOutExpo: (t) => (t <= 0 ? 0 : t >= 1 ? 1 : t < 0.5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2),
	outCubic: (t) => 1 - Math.pow(1 - t, 3),
	inCubic: (t) => t * t * t,
	inOutCubic: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
	outBack: (t) => { const s = 1.70158; return 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2); },
	outBounce: (t) => {
		const n = 7.5625, d = 2.75;
		if (t < 1 / d) return n * t * t;
		if (t < 2 / d) return n * (t -= 1.5 / d) * t + 0.75;
		if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + 0.9375;
		return n * (t -= 2.625 / d) * t + 0.984375;
	},
};
const spring = (t, f = 2.2, z = 0.32) => (t <= 0 ? 0 : 1 - Math.exp(-z * f * 2 * Math.PI * t) * Math.cos(f * 2 * Math.PI * Math.sqrt(1 - z * z) * t));
function rng(seed) {
	return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let x = Math.imul(seed ^ (seed >>> 15), 1 | seed); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; };
}

const font = (size, weight = 900, family = DISP) => `${weight} ${size}px ${family}`;
function measure(str, size, weight = 900, family = DISP, spacing = 0) {
	g.save(); g.font = font(size, weight, family); g.letterSpacing = `${spacing}px`; const w = g.measureText(str).width; g.restore(); return w;
}
function fit(str, size, maxW, weight = 900, family = DISP, spacing = 0) {
	const w = measure(str, size, weight, family, spacing);
	return w > maxW ? Math.floor(size * maxW / w) : size;
}
function wrap(str, size, maxW, weight = 500, family = DISP) {
	const words = str.split(" "), lines = [];
	let cur = "";
	for (const w of words) {
		const next = cur ? `${cur} ${w}` : w;
		if (measure(next, size, weight, family) > maxW && cur) { lines.push(cur); cur = w; } else cur = next;
	}
	if (cur) lines.push(cur);
	return lines;
}
function text(str, x, y, { size = 40, weight = 900, family = DISP, color = C.bone, align = "left", alpha = 1, spacing = 0, base = "alphabetic" } = {}) {
	if (alpha <= 0) return;
	g.save();
	g.globalAlpha *= alpha;
	g.font = font(size, weight, family);
	g.letterSpacing = `${spacing}px`;
	g.textAlign = align;
	g.textBaseline = base;
	g.fillStyle = color;
	g.fillText(str, x, y);
	g.restore();
}
const mono = (str, x, y, size = 22, color = C.bone, o = {}) => text(str, x, y, { size, weight: o.weight ?? 500, family: MONO, color, ...o });
function glyphs(str, size, weight = 900, family = DISP, spacing = 0) {
	g.save(); g.font = font(size, weight, family); g.letterSpacing = `${spacing}px`;
	const xs = []; for (let i = 0; i < str.length; i++) xs.push(g.measureText(str.slice(0, i + 1)).width - g.measureText(str[i]).width);
	const width = g.measureText(str).width; g.restore();
	return { xs, width };
}
function perChar(str, cx, cy, size, fn, { weight = 900, family = DISP, spacing = 0, color = C.bone, align = "center", clip = false } = {}) {
	const { xs, width } = glyphs(str, size, weight, family, spacing);
	const left = align === "center" ? cx - width / 2 : align === "right" ? cx - width : cx;
	for (let i = 0; i < str.length; i++) {
		const m = fn(i, str[i]);
		if (!m || m.alpha === 0) continue;
		g.save();
		if (clip) { g.beginPath(); g.rect(left - 60, cy - size * 1.05, width + 120, size * 1.38); g.clip(); }
		g.globalAlpha *= m.alpha ?? 1;
		g.translate(left + xs[i] + (m.dx ?? 0), cy + (m.dy ?? 0));
		if (m.rot) g.rotate(m.rot);
		if (m.sx !== undefined || m.sy !== undefined) g.scale(m.sx ?? 1, m.sy ?? 1);
		g.font = font(size, weight, family); g.letterSpacing = `${spacing}px`; g.fillStyle = m.color ?? color;
		g.fillText(str[i], 0, 0);
		g.restore();
	}
	return { left, width };
}
function maskUp(str, x, y, size, t0, t, opts = {}) {
	const stagger = opts.stagger ?? 0.03, dur = opts.dur ?? 0.7;
	return perChar(str, x, y, size, (i) => {
		const k = E.outExpo(P(t, t0 + i * stagger, t0 + i * stagger + dur));
		return { dy: (1 - k) * size * 1.2, alpha: k > 0 ? 1 : 0 };
	}, { ...opts, clip: true });
}
function circle(x, y, r, fill, alpha = 1) { if (r <= 0 || alpha <= 0) return; g.save(); g.globalAlpha *= alpha; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fillStyle = fill; g.fill(); g.restore(); }
function ring(x, y, r, stroke, w = 2, alpha = 1, from = 0, to = Math.PI * 2) { if (r <= 0 || alpha <= 0) return; g.save(); g.globalAlpha *= alpha; g.beginPath(); g.arc(x, y, r, from, to); g.strokeStyle = stroke; g.lineWidth = w; g.stroke(); g.restore(); }
function rrect(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, Math.max(0, w), Math.max(0, h), Math.max(0, Math.min(r, Math.abs(h) / 2, Math.abs(w) / 2))); }
function box(x, y, w, h, { r = 16, fill = C.card, stroke = C.faint, lw = 2, alpha = 1 } = {}) {
	if (alpha <= 0) return; g.save(); g.globalAlpha *= alpha; rrect(x, y, w, h, r);
	if (fill) { g.fillStyle = fill; g.fill(); } if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw; g.stroke(); } g.restore();
}
function line(x1, y1, x2, y2, color, w = 2, alpha = 1, dash) { if (alpha <= 0) return; g.save(); g.globalAlpha *= alpha; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.strokeStyle = color; g.lineWidth = w; g.lineCap = "round"; if (dash) g.setLineDash(dash); g.stroke(); g.restore(); }
function fill(color) { g.fillStyle = color; g.fillRect(-W, -H, W * 3, H * 3); }
function chip(x, y, str, { size = 20, color = C.bone, stroke = C.faint, bg = null, alpha = 1, padX = 16, h = 40, align = "left" } = {}) {
	const w = measure(str, size, 500, MONO) + padX * 2;
	const left = align === "center" ? x - w / 2 : align === "right" ? x - w : x;
	if (alpha > 0) { box(left, y - h / 2, w, h, { r: h / 2, fill: bg, stroke, lw: 1.5, alpha }); mono(str, left + padX, y + size * 0.36, size, color, { alpha }); }
	return w;
}
function bezier(p0, p1, p2, p3, k) {
	const u = 1 - k;
	return { x: u * u * u * p0.x + 3 * u * u * k * p1.x + 3 * u * k * k * p2.x + k * k * k * p3.x, y: u * u * u * p0.y + 3 * u * u * k * p1.y + 3 * u * k * k * p2.y + k * k * k * p3.y };
}
function check(x, y, s, k, color, w = 6) {
	if (k <= 0) return;
	const pts = [[-0.5, 0], [-0.15, 0.35], [0.55, -0.4]].map(([a, b]) => [x + a * s, y + b * s]);
	const l1 = Math.hypot(pts[1][0] - pts[0][0], pts[1][1] - pts[0][1]), l2 = Math.hypot(pts[2][0] - pts[1][0], pts[2][1] - pts[1][1]);
	const d = k * (l1 + l2);
	g.save(); g.strokeStyle = color; g.lineWidth = w; g.lineCap = "round"; g.lineJoin = "round"; g.beginPath(); g.moveTo(...pts[0]);
	if (d <= l1) g.lineTo(lerp(pts[0][0], pts[1][0], d / l1), lerp(pts[0][1], pts[1][1], d / l1));
	else { g.lineTo(...pts[1]); g.lineTo(lerp(pts[1][0], pts[2][0], (d - l1) / l2), lerp(pts[1][1], pts[2][1], (d - l1) / l2)); }
	g.stroke(); g.restore();
}
function cross(x, y, s, k, color, w = 5) {
	if (k <= 0) return;
	const a = clamp(k * 2), b = clamp(k * 2 - 1);
	line(x - s, y - s, x - s + 2 * s * a, y - s + 2 * s * a, color, w);
	if (b > 0) line(x + s, y - s, x + s - 2 * s * b, y - s + 2 * s * b, color, w);
}
function strike(x, y, w, k, color = C.dim) { if (k > 0) line(x, y, x + w * k, y, color, 2.5); }
function warn(x, y, s, k, color = C.acc) {
	if (k <= 0) return;
	g.save(); g.translate(x, y); g.scale(k, k); g.beginPath(); g.moveTo(0, -s); g.lineTo(s * 0.95, s * 0.7); g.lineTo(-s * 0.95, s * 0.7); g.closePath();
	g.fillStyle = color; g.fill(); g.fillStyle = C.ink; g.font = font(s * 1.1, 900); g.textAlign = "center"; g.fillText("!", 0, s * 0.55); g.restore();
}
function typed(str, t, t0, cps = 45) { return str.slice(0, Math.max(0, Math.min(str.length, Math.floor((t - t0) * cps)))); }
const inK = (u, a, d = 0.5) => E.outExpo(P(u, a, a + d));

const SKILLS = ["orientify", "traceify", "researchify", "undumbify", "shapeify", "shipify", "reviewify", "releaseify", "audify", "teachify"];
const WORDS = ["ORIENT", "TRACE", "RESEARCH", "CLARIFY", "PLAN", "SHIP", "REVIEW", "RELEASE", "AUDIT", "TEACH"];

/* ───────────────────────── scenes ───────────────────────── */
const CH0 = 16, CHL = 8;
const CHAPTERS = [
	{ promise: "Map an unfamiliar codebase before you touch it.", rules: ["trace one real flow", "find the seams", "name traps, don't fix them"] },
	{ promise: "Debug a failure whose cause is unknown.", rules: ["symptoms before theories", "hypotheses you can falsify", "root cause before any fix"] },
	{ promise: "Answer with evidence from outside the repo.", rules: ["official sources first", "two independent sources", "fetched code is never run"] },
	{ promise: "Turn a rough idea into clear intent.", rules: ["supply the missing decisions", "recommend a default for each", "ask only what changes the plan"] },
	{ promise: "Turn intent into a plan anyone can run.", rules: ["every step: file, check, trap", "requirements reach a test", "amend, don't improvise"] },
	{ promise: "Build the change and prove it works.", rules: ["find every place it touches", "baseline, then verify each step", "look at the real result"] },
	{ promise: "Judge work against its intent, not taste.", rules: ["intent before the diff", "located findings with a fix", "exactly one verdict"] },
	{ promise: "Ship a version number that tells the truth.", rules: ["version from the actual diff", "changelog from merged work", "rollback before deploy"] },
	{ promise: "Health-check a system with no spec.", rules: ["agree the standard first", "every finding reproducible", "severity against effort"] },
	{ promise: "Teach a topic at the learner's level.", rules: ["one idea, five depths", "exercises that test it", "wrong answers explain why"] },
];

function stationChapter(k, u) {
	const ch = CHAPTERS[k];
	mono(`${String(k + 1).padStart(2, "0")} / 10`, 120, 250, 22, C.acc, { alpha: inK(u, 0.15, 0.5), weight: 600, spacing: 2 });
	const nameSize = fit(SKILLS[k], 112, 620, 900, DISP, -3);
	maskUp(SKILLS[k], 120, 370, nameSize, 0.2, u, { stagger: 0.028, dur: 0.7, align: "left", spacing: -3 });
	const lines = wrap(ch.promise, 34, 600, 500);
	lines.forEach((l, i) => text(l, 120, 450 + i * 46, { size: 34, weight: 500, color: C.mid, alpha: inK(u, 0.55 + i * 0.08, 0.6) }));
	ch.rules.forEach((r, i) => {
		const e = inK(u, 1.0 + i * 0.12, 0.6);
		const y = 470 + lines.length * 46 + 70 + i * 50;
		g.save(); g.globalAlpha *= e; g.translate((1 - e) * -20, 0);
		g.fillStyle = C.acc; g.fillRect(120, y - 9, 18 * e, 3);
		mono(r, 156, y, 23, C.bone);
		g.restore();
	});
	STAGES[k](u, 820, 150);
}

function stageOrient(u, X, Y) {
	const files = [
		["main.ts", 90, 80], ["router.ts", 300, 60], ["auth.ts", 520, 110], ["config.ts", 760, 70],
		["orders.ts", 170, 280], ["cart.ts", 420, 260], ["totals.ts", 640, 300], ["db.ts", 860, 260],
		["invoice.ts", 120, 480], ["email.ts", 360, 500], ["cache.ts", 600, 480], ["queue.ts", 840, 450],
		["legacy/pay.ts", 200, 660], ["report.ts", 470, 690], ["utils.ts", 720, 660],
	];
	const edges = [[0, 1], [1, 2], [1, 4], [1, 5], [2, 3], [4, 6], [5, 6], [6, 7], [4, 8], [8, 9], [6, 10], [10, 7], [9, 11], [8, 12], [12, 13], [13, 14], [10, 14], [3, 7]];
	const flow = [0, 1, 4, 6, 10, 7];
	const P0 = (i) => ({ x: X + files[i][1], y: Y + files[i][2] });
	edges.forEach(([a, b], i) => { const e = inK(u, 0.9 + i * 0.03, 0.6); const p = P0(a), q = P0(b); line(p.x, p.y, lerp(p.x, q.x, e), lerp(p.y, q.y, e), C.faint, 1.5); });
	const fk = P(u, 1.9, 4.2) * (flow.length - 1);
	for (let s = 0; s < flow.length - 1; s++) {
		const e = clamp(fk - s); if (e <= 0) continue;
		const p = P0(flow[s]), q = P0(flow[s + 1]);
		line(p.x, p.y, lerp(p.x, q.x, E.inOutCubic(e)), lerp(p.y, q.y, E.inOutCubic(e)), C.acc, 3);
	}
	if (fk > 0 && fk < flow.length - 1) { const s = Math.floor(fk), e = E.inOutCubic(fk - s); const p = P0(flow[s]), q = P0(flow[s + 1]); circle(lerp(p.x, q.x, e), lerp(p.y, q.y, e), 9, C.acc); ring(lerp(p.x, q.x, e), lerp(p.y, q.y, e), 18, C.acc, 1.5, 0.5); }
	const seam = inK(u, 4.3, 0.7);
	if (seam > 0) {
		g.save(); g.globalAlpha = seam; g.setLineDash([6, 8]); g.strokeStyle = C.mid; g.lineWidth = 1.5;
		rrect(X + 20, Y + 20, 580 * seam, 150, 22); g.stroke(); rrect(X + 60, Y + 220, 880 * seam, 330, 22); g.stroke(); g.restore();
		mono("api", X + 36, Y + 196, 16, C.mid, { alpha: seam }); mono("domain", X + 76, Y + 576, 16, C.mid, { alpha: seam });
	}
	files.forEach(([name], i) => {
		const e = spring(u - (0.5 + i * 0.04), 2.6, 0.4), p = P0(i);
		const lit = flow.includes(i) && fk >= flow.indexOf(i) - 0.02;
		circle(p.x, p.y, 8 * e, lit ? C.acc : C.bone);
		mono(name, p.x + 16, p.y - 14, 16, lit ? C.bone : C.dim, { alpha: clamp(e) });
	});
	const traps = [[12, "half-migrated"], [10, "untested"]];
	traps.forEach(([i, label], j) => { const e = E.outBack(P(u, 5.1 + j * 0.25, 5.45 + j * 0.25)); const p = P0(i); warn(p.x, p.y - 34, 14, e); mono(label, p.x + 16, p.y + 26, 15, C.acc, { alpha: clamp(e) }); });
	const b = inK(u, 5.9, 0.7);
	if (b > 0) {
		box(X + 560, Y + 580 + (1 - b) * 30, 420, 150, { alpha: b, stroke: C.faint });
		mono("Codebase Brief", X + 586, Y + 622 + (1 - b) * 30, 18, C.acc, { alpha: b, weight: 600 });
		["flow: main → router → orders → totals", "seams: api | domain", "traps: 2 named, 0 fixed"].forEach((l, i) => mono(l, X + 586, Y + 658 + i * 26 + (1 - b) * 30, 15, C.mid, { alpha: inK(u, 6.1 + i * 0.1, 0.5) }));
	}
}

function stageTrace(u, X, Y) {
	const pill = inK(u, 0.6, 0.6);
	box(X, Y + 20, 980 * pill, 72, { r: 36, fill: null, stroke: C.faint, alpha: pill });
	circle(X + 40, Y + 56, 7, C.acc, pill * (0.5 + 0.5 * Math.abs(Math.sin(u * 5))));
	const sym = "POST /checkout → 500 · since the 09:14 deploy";
	mono(typed(sym, u, 0.8, 50), X + 66, Y + 64, fit(sym, 24, 860, 500, MONO), C.bone);
	const H3 = [
		["H1", "env var drift on new host", "diff env", false],
		["H2", "DB pool exhausted after ORM bump", "pool metrics", true],
		["H3", "race in session refresh", "replay", false],
	];
	const cw = 310, gap = 25;
	H3.forEach(([id, label, test, ok], i) => {
		const e = inK(u, 1.6 + i * 0.12, 0.6);
		const x = X + i * (cw + gap), y = Y + 150 + (1 - e) * 40;
		const run = P(u, 2.7 + i * 0.7, 3.2 + i * 0.7);
		const done = u > 3.2 + i * 0.7;
		const verdict = done ? (ok ? 1 : -1) : 0;
		const dimmed = verdict === -1 ? 0.45 : 1;
		box(x, y, cw, 250, { alpha: e, stroke: verdict === 1 ? C.acc : C.faint, lw: verdict === 1 ? 2.5 : 2 });
		g.save(); g.globalAlpha *= e * dimmed;
		mono(id, x + 24, y + 44, 22, C.acc, { weight: 700 });
		wrap(label, 26, cw - 48, 700).forEach((l, j) => text(l, x + 24, y + 92 + j * 34, { size: 26, weight: 700, color: C.bone }));
		mono(`test: ${test}`, x + 24, y + 206, 17, C.dim);
		g.fillStyle = C.faint; g.fillRect(x + 24, y + 222, cw - 48, 4);
		g.fillStyle = verdict === 1 ? C.acc : C.mid; g.fillRect(x + 24, y + 222, (cw - 48) * run, 4);
		g.restore();
		if (verdict === -1) cross(x + cw - 40, y + 42, 12, E.outCubic(P(u, 3.2 + i * 0.7, 3.45 + i * 0.7)), C.dim, 4);
		if (verdict === 1) check(x + cw - 40, y + 42, 34, E.outCubic(P(u, 3.2 + i * 0.7, 3.5 + i * 0.7)), C.acc, 5);
	});
	const rc = inK(u, 5.0, 0.6);
	if (rc > 0) {
		box(X, Y + 460, 980, 190, { alpha: rc, fill: "#14100f", stroke: C.acc, lw: 1.5 });
		mono("ROOT CAUSE", X + 30, Y + 506, 17, C.acc, { alpha: rc, weight: 700, spacing: 2 });
		const s = "The 500s come from pool exhaustion: ORM 5.0 halved the pool, so checkout runs out of connections under load.";
		wrap(typed(s, u, 5.3, 60), 28, 920, 600).forEach((l, i) => text(l, X + 30, Y + 556 + i * 38, { size: 28, weight: 600, color: C.bone }));
	}
	const fx = E.outBack(P(u, 6.7, 7.0));
	if (fx > 0) { g.save(); g.translate(X + 30, Y + 700); g.scale(fx, fx); chip(0, 0, "then fix · pool = 10 · regression test ✓", { size: 18, color: C.ok, stroke: "#1f4a33" }); g.restore(); }
}

function stageResearch(u, X, Y) {
	const q = "Does SQLite in WAL mode allow concurrent writers?";
	text(typed(q, u, 0.6, 70), X, Y + 50, { size: fit(q, 30, 980, 700), weight: 700, color: C.bone });
	const tiers = ["official", "maintainers", "maintained", "popular, stale"];
	const ty = (i) => Y + 150 + i * 120;
	tiers.forEach((tn, i) => {
		const e = inK(u, 1.0 + i * 0.08, 0.6);
		line(X, ty(i) + 44, X + 980 * e, ty(i) + 44, C.line, 1.5);
		mono(tn, X, ty(i) + 30, 18, i === 3 ? C.dim : C.mid, { alpha: e });
	});
	const cards = [[0, "sqlite.org/wal.html"], [1, "forum · D. R. Hipp"], [2, "2024 benchmark blog"], [3, "StackOverflow · 2013"]];
	cards.forEach(([tier, label], i) => {
		const t0 = 1.8 + i * 0.35;
		const e = E.outBounce(P(u, t0, t0 + 0.6));
		const x = X + 240, y = lerp(Y - 60, ty(tier) - 4, e);
		const drop = tier === 3 && u > 4.0;
		const a = P(u, t0, t0 + 0.05) * (drop ? 0.4 : 1);
		box(x, y, 400, 50, { r: 10, alpha: a, stroke: tier < 2 ? C.mid : C.faint });
		mono(label, x + 20, y + 32, 18, drop ? C.dim : C.bone, { alpha: a });
		if (drop) { strike(x + 20, y + 26, measure(label, 18, 500, MONO), E.outCubic(P(u, 4.0, 4.3))); mono("dropped: outdated", x + 420, y + 32, 16, C.dim, { alpha: inK(u, 4.1, 0.4) }); }
	});
	const F = { x: X + 740, y: Y + 200 };
	const fk = inK(u, 4.4, 0.8);
	if (fk > 0) {
		for (const i of [0, 1]) {
			const s = { x: X + 640, y: ty(i) + 21 };

	if (t < hold || j === STATIONS.length - 1) return { x: c.x, y: c.y, z: 1 };
	const k = E.inOutCubic(P(t, hold, st.start + st.dur)), n = centerOf(j + 1);
	return { x: lerp(c.x, n.x, k), y: lerp(c.y, n.y, k), z: 1 - 0.2 * Math.sin(Math.PI * k) };
}

const L0 = introLayout();
const WAY = [{ x: L0.ulx1, y: L0.uly }, { x: L0.ulx1 + 420, y: L0.uly + 40 }, { x: 1760, y: BASE_Y }];
STATIONS.forEach((st, j) => { if (j) WAY.push({ x: st.ox + 80, y: st.oy + BASE_Y }, { x: st.ox + 1840, y: st.oy + BASE_Y }); });
const PATH = [], CUM = [0], WAYLEN = [0];
{
	const pts = [WAY[0], ...WAY, WAY[WAY.length - 1]];
	for (let i = 1; i < pts.length - 2; i++) {
		const [p0, p1, p2, p3] = [pts[i - 1], pts[i], pts[i + 1], pts[i + 2]];
		const steps = 40;
		for (let s = 0; s < steps; s++) {
			const t = s / steps, t2 = t * t, t3 = t2 * t;
			const f = (a, b, c, d) => 0.5 * (2 * b + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3);
			PATH.push({ x: f(p0.x, p1.x, p2.x, p3.x), y: f(p0.y, p1.y, p2.y, p3.y) });
		}
	}
	PATH.push(WAY[WAY.length - 1]);
	for (let i = 1; i < PATH.length; i++) CUM.push(CUM[i - 1] + Math.hypot(PATH[i].x - PATH[i - 1].x, PATH[i].y - PATH[i - 1].y));
	for (let w = 1; w < WAY.length; w++) WAYLEN.push(CUM[w * 40]);
}
const MILES = [[0, 0], [7.6, 0]];
{
	const intro = STATIONS[0];
	MILES.push([intro.start + intro.dur - GLIDE, WAYLEN[2]]);
	STATIONS.forEach((st, j) => {
		if (!j) return;
		const a = WAYLEN[2 * j + 1], b = WAYLEN[2 * j + 2];
		MILES.push([st.start, a + 60], [st.start + st.dur - GLIDE, b]);
	});
	MILES.push([T_OUT + 5, CUM[CUM.length - 1]]);
}
function headAt(t) {
	for (let i = 1; i < MILES.length; i++) {
		const [t0, s0] = MILES[i - 1], [t1, s1] = MILES[i];
		if (t <= t1) { const k = t1 > t0 ? P(t, t0, t1) : 1; return lerp(s0, s1, s1 - s0 > 400 && t1 - t0 <= GLIDE + 0.01 ? E.inOutCubic(k) : k); }
	}
	return CUM[CUM.length - 1];
}
function pointAt(s) {
	let lo = 0, hi = CUM.length - 1;
	while (hi - lo > 1) { const m = (lo + hi) >> 1; if (CUM[m] < s) lo = m; else hi = m; }
	const k = CUM[hi] > CUM[lo] ? (s - CUM[lo]) / (CUM[hi] - CUM[lo]) : 0;
	return { x: lerp(PATH[lo].x, PATH[hi].x, k), y: lerp(PATH[lo].y, PATH[hi].y, k), i: lo };
}
function drawThread(t, z) {
	const s = headAt(t);
	if (s <= 0) return;
	const head = pointAt(s);
	g.save();
	g.lineCap = "round"; g.lineJoin = "round";
	g.strokeStyle = C.acc; g.lineWidth = 2.5 / z;
	g.globalAlpha = 0.9;
	g.beginPath(); g.moveTo(PATH[0].x, PATH[0].y);
	for (let i = 1; i <= head.i; i++) g.lineTo(PATH[i].x, PATH[i].y);
	g.lineTo(head.x, head.y); g.stroke();
	g.restore();
	const glow = g.createRadialGradient(head.x, head.y, 0, head.x, head.y, 42 / z);
	glow.addColorStop(0, "rgba(242,163,58,0.45)"); glow.addColorStop(1, "rgba(242,163,58,0)");
	g.fillStyle = glow; g.beginPath(); g.arc(head.x, head.y, 42 / z, 0, Math.PI * 2); g.fill();
	circle(head.x, head.y, 5.5 / z, C.bone);
	STATIONS.forEach((st, j) => {
		if (!j) return;
		const m = { x: st.ox + 80, y: st.oy + BASE_Y };
		const reached = s >= WAYLEN[2 * j + 1];
		ring(m.x, m.y, 9 / z, reached ? C.acc : C.faint, 2 / z);
		if (reached) circle(m.x, m.y, 4 / z, C.acc);
	});
}

function drawStation(j, t, alpha) {
	const st = STATIONS[j];
	const u = clamp(t - st.start + (j ? LEAD : 0), 0, st.dur + LEAD);
	if (t < st.start - GLIDE - 0.2) return;
	g.save(); g.translate(st.ox, st.oy); g.globalAlpha = alpha;
	if (st.kind === "intro") stationIntro(u);
	else if (st.kind === "chapter") stationChapter(st.k, u);
	else if (st.kind === "agents") stationAgents(u);
	else stationEvidence(u);
	if (j) mono(LABELS[j], 110, BASE_Y + 46, 17, C.dim, { alpha: 0.9 });
	g.restore();
}

function draw(t) {
	g.setTransform(1, 0, 0, 1, 0, 0);
	g.globalAlpha = 1;
	g.filter = "none";
	fill(C.ink);
	const cam = camera(t);
	g.save();
	g.translate(W / 2, H / 2); g.scale(cam.z, cam.z); g.translate(-cam.x, -cam.y);
	const vw = W / cam.z / 2 + 200, vh = H / cam.z / 2 + 200;
	const outK = P(t, T_OUT, T_OUT + 3);
	STATIONS.forEach((st, j) => {
		const c = centerOf(j);
		if (Math.abs(c.x - cam.x) > vw + W / 2 || Math.abs(c.y - cam.y) > vh + H / 2) return;
		const d = Math.hypot(c.x - cam.x, c.y - cam.y);
		const focus = clamp(1 - d / 2300);
		drawStation(j, t, lerp(0.28, 1, focus) * lerp(1, 0.5, outK));
	});
	drawThread(t, cam.z);
	g.restore();
	finale(t);
}

function finale(t) {
	const u = t - T_OUT;
	if (u < 3.5) return;
	const k = E.inOutCubic(P(u, 3.5, 5.0));
	const grad = g.createRadialGradient(W / 2, H / 2 + 20, 60, W / 2, H / 2 + 20, 760);
	grad.addColorStop(0, `rgba(7,8,10,${0.88 * k})`); grad.addColorStop(1, "rgba(7,8,10,0)");
	g.fillStyle = grad; g.fillRect(0, 0, W, H);
	const fadeAll = 1 - E.inOutCubic(P(u, 10.2, 11.8));
	g.save(); g.globalAlpha = fadeAll;
	maskUp("Skillify", W / 2, H / 2 + 20, 190, T_OUT + 4.2, t, { stagger: 0.05, dur: 1.1, align: "center", spacing: -5 });
	const tag = "Say what you want. The right method loads.";
	let x = W / 2 - measure(tag, 38, 500) / 2;
	tag.split(" ").forEach((w, i) => {
		const e = E.outCubic(P(u, 5.4 + i * 0.08, 6.2 + i * 0.08));
		text(w, x, H / 2 + 120 + (1 - e) * 16, { size: 38, weight: 500, color: i >= 4 ? C.bone : C.mid, alpha: e });
		x += measure(w + " ", 38, 500);
	});
	mono("10 skills · 4 agents · 2.6 KB always loaded · any assistant", W / 2, H / 2 + 186, 21, C.dim, { align: "center", alpha: E.outCubic(P(u, 6.6, 7.4)), spacing: 1 });
	mono("github.com/trykA123/skillify", W / 2, H - 100, 24, C.acc, { align: "center", alpha: E.outCubic(P(u, 7.2, 8.0)), weight: 600 });
	g.restore();
	g.fillStyle = `rgba(0,0,0,${E.inOutCubic(P(u, 10.6, 12))})`; g.fillRect(0, 0, W, H);
}
const grain = document.createElement("canvas");
grain.width = grain.height = 256;
{
	const gx = grain.getContext("2d"), img = gx.createImageData(256, 256), r = rng(99);
	for (let i = 0; i < img.data.length; i += 4) { const v = r() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
	gx.putImageData(img, 0, 0);
}
const vignette = out.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 1.05);
vignette.addColorStop(0, "rgba(0,0,0,0)");
vignette.addColorStop(1, "rgba(0,0,0,0.24)");

function render(t, samples = 6) {
	if (t > T_OUT + 0.5) samples = Math.min(samples, 3);
	out.setTransform(1, 0, 0, 1, 0, 0);
	const shutter = 0.5 / FPS;
	for (let s = 0; s < samples; s++) {
		draw(Math.max(0, t - (shutter * s) / Math.max(1, samples - 1)));
		out.globalAlpha = 1 / (s + 1);
		out.drawImage(buf, 0, 0);
	}
	out.globalAlpha = 1;
	out.fillStyle = vignette; out.fillRect(0, 0, W, H);
	const r = rng(Math.floor(t * FPS) + 1);
	out.save(); out.globalAlpha = 0.045; out.globalCompositeOperation = "overlay";
	out.translate(-r() * 256, -r() * 256);
	out.fillStyle = out.createPattern(grain, "repeat"); out.fillRect(0, 0, W + 256, H + 256);
	out.restore();
}

window.render = render;
window.DURATION = DUR;
window.ready = Promise.all([
	document.fonts.load(font(100, 900, DISP)), document.fonts.load(font(100, 800, DISP)), document.fonts.load(font(100, 700, DISP)), document.fonts.load(font(100, 600, DISP)), document.fonts.load(font(100, 500, DISP)),
	document.fonts.load(font(40, 500, MONO)), document.fonts.load(font(40, 600, MONO)), document.fonts.load(font(40, 700, MONO)), document.fonts.load(font(40, 800, MONO)),
]);
if (!location.search.includes("record")) {
	window.ready.then(() => {
		const q = new URLSearchParams(location.search), from = Number(q.get("t") ?? 0);
		const start = performance.now();
		const loop = () => { render((from + (performance.now() - start) / 1000) % DUR, 1); requestAnimationFrame(loop); };
		loop();
	});
}
