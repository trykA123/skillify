name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: bash -n install.sh scripts/test.sh
      - run: node scripts/validate.mjs
      - run: bash scripts/test.sh
      - run: node scripts/test-teachify-interaction.mjs
      - run: node scripts/validate.mjs --report >> "$GITHUB_STEP_SUMMARY"
