name: Feedback dashboard

on:
  push:
    branches: [main]
    paths:
      - "feedback/**"
      - "scripts/feedback-report.mjs"
      - "scripts/readme-evidence.mjs"
      - "README.md"
      - "evals/results/**"
      - "evals/paired/**"
      - "dashboard/**"
      - "docs/cinematic-reel-v2/**"
      - ".github/workflows/feedback.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: node scripts/readme-evidence.mjs --check
      - run: bun install --frozen-lockfile
        working-directory: dashboard
      - run: bun run build
        working-directory: dashboard
      - run: node scripts/feedback-report.mjs --output dashboard/dist/one-page.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist
      - id: deployment
        uses: actions/deploy-pages@v4
