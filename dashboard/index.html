    <script>
      try {
        var t = localStorage.getItem("skillify-theme");
        document.documentElement.dataset.theme = t === "light" || t === "dark" ? t : matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.style.background = document.documentElement.dataset.theme === "light" ? "#f4f5fa" : "#06070d";
      } catch (e) {}
    </script>
